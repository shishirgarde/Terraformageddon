# Docker is used ONLY to build and run isolated per-user Terraform sandbox
# containers. The FastAPI backend runs natively on the host (uvicorn) and
# talks to the Docker daemon via the local socket / named pipe to spawn one
# sandbox container per session.
#
# Usage:
#   docker compose build sandbox             # build the sandbox image once
#   docker compose build sandbox --no-cache  # force rebuild
#
# The `sandbox` service is never started by compose — the backend creates
# containers from this image on demand. The `profiles: ["build-only"]` guard
# ensures `docker compose up` will not try to run it.

services:
  sandbox:
    image: terraformageddon-sandbox:latest
    build:
      context: ./backend/docker/terraform-sandbox
      dockerfile: Dockerfile
    profiles: ["build-only"]
